<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contro — Expense & Split Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0C;
    --surface: #151519;
    --surface-2: #1D1D23;
    --surface-3: #26262E;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --text-primary: #F8FAFC;
    --text-secondary: #9CA3AF;
    --text-muted: #6B7280;
    --blue: #60A5FA;
    --blue-bg: rgba(59, 130, 246, 0.14);
    --blue-border: rgba(96, 165, 250, 0.32);
    --red: #F87171;
    --red-bg: rgba(239, 68, 68, 0.14);
    --red-border: rgba(248, 113, 113, 0.32);
    --green: #34D399;
    --green-bg: rgba(16, 185, 129, 0.14);
    --green-border: rgba(52, 211, 153, 0.32);
    --grey-status: #9CA3AF;
    --grey-bg: rgba(156, 163, 175, 0.12);
    --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.42);
    --shadow-aurora: 0 18px 40px -10px rgba(99, 102, 241, 0.34);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    height: 100dvh;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
    background: #050507;
    color: var(--text-primary);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  .num {
    font-variant-numeric: tabular-nums;
  }

  .app-shell {
    max-width: 480px;
    margin: 0 auto;
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    position: relative;
    border-left: 1px solid rgba(255, 255, 255, 0.04);
    border-right: 1px solid rgba(255, 255, 255, 0.04);
  }

  /* Header */
  .top-header {
    height: 62px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10, 10, 12, 0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 20;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 11px;
    background: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0A0A0C;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: -0.04em;
  }

  .brand-meta {
    display: flex;
    flex-direction: column;
  }

  .brand-sub {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-muted);
    line-height: 1.1;
  }

  .brand-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .month-chip {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 10px;
  }

  .icon-btn-box {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-primary);
    cursor: pointer;
    position: relative;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .icon-btn-box:hover, .icon-btn-box:active {
    background: var(--surface-3);
    border-color: var(--border-strong);
  }

  .backup-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #FBBF24;
    display: none;
  }

  .backup-dot.show {
    display: block;
  }

  /* Backup Reminder Banner */
  .reminder-banner {
    display: none;
    margin: 12px 16px 0;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 12px;
    color: var(--text-primary);
  }

  .reminder-banner.show {
    display: flex;
  }

  .reminder-btn {
    background: #FFFFFF;
    color: #0A0A0C;
    border: none;
    padding: 6px 11px;
    border-radius: 9px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Views */
  .view-container {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 106px;
    scroll-behavior: smooth;
  }

  .view-container::-webkit-scrollbar {
    width: 0;
    height: 0;
  }

  .view-container.chat-active {
    padding-bottom: 162px;
  }

  .tab-view {
    display: none;
    animation: fadeSlide 0.2s ease;
  }

  .tab-view.active {
    display: block;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Drill-down Bar */
  .drilldown-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
  }

  .back-box-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 10px;
    cursor: pointer;
  }

  .drilldown-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
  }

  /* Iridescent Aurora Hero Card (matching reference screenshot) */
  .hero-card {
    position: relative;
    border-radius: 22px;
    padding: 20px;
    color: #FFFFFF;
    box-shadow: var(--shadow-aurora);
    margin-bottom: 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background:
      radial-gradient(circle at 14% 18%, rgba(165, 180, 252, 0.92) 0%, transparent 48%),
      radial-gradient(circle at 86% 22%, rgba(253, 224, 171, 0.85) 0%, transparent 45%),
      radial-gradient(circle at 65% 88%, rgba(110, 231, 183, 0.72) 0%, transparent 50%),
      radial-gradient(circle at 22% 85%, rgba(96, 165, 250, 0.88) 0%, transparent 52%),
      linear-gradient(135deg, #312E81 0%, #1E1B4B 52%, #0F172A 100%);
  }

  .hero-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10, 10, 14, 0.14) 0%, rgba(10, 10, 14, 0.44) 100%);
    pointer-events: none;
  }

  .hero-inner {
    position: relative;
    z-index: 2;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
  }

  .hero-label {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.88);
    margin-bottom: 4px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
  }

  .hero-amount {
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: #FFFFFF;
    line-height: 1.08;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.28);
  }

  .limit-box-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 11px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: #FFFFFF;
    background: rgba(15, 15, 20, 0.45);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.24);
    padding: 6px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.12s ease;
  }

  .limit-box-btn:hover, .limit-box-btn:active {
    background: rgba(15, 15, 20, 0.65);
  }

  .ring-wrap {
    position: relative;
    width: 74px;
    height: 74px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 14, 0.28);
    border-radius: 50%;
    backdrop-filter: blur(8px);
  }

  .ring-text {
    position: absolute;
    text-align: center;
    line-height: 1.15;
  }

  .ring-pct {
    font-size: 14px;
    font-weight: 800;
    color: #FFFFFF;
    display: block;
  }

  .ring-sub {
    font-size: 9px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.8);
    letter-spacing: 0.06em;
  }

  .hero-stats {
    display: flex;
    align-items: center;
    margin-top: 16px;
    padding-top: 13px;
    border-top: 1px solid rgba(255, 255, 255, 0.22);
  }

  .hero-stat {
    flex: 1;
  }

  .hero-stat-label {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.78);
    margin-bottom: 2px;
  }

  .hero-stat-val {
    font-size: 15px;
    font-weight: 700;
    color: #FFFFFF;
  }

  .hero-stat-val.over-limit {
    color: #FECACA;
  }

  .hero-divider {
    width: 1px;
    height: 26px;
    background: rgba(255, 255, 255, 0.24);
    margin: 0 16px;
  }

  /* Boxy 3-Tile Action Row (matching Send / Receive / Top Up tiles in screenshot) */
  .box-action-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .box-tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    height: 68px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }

  .box-tile:hover, .box-tile:active {
    background: var(--surface-2);
    border-color: var(--border-strong);
    transform: translateY(-1px);
  }

  .box-tile.primary-white {
    background: #FFFFFF;
    color: #0A0A0C;
    border-color: #FFFFFF;
    font-weight: 700;
  }

  .box-tile.primary-white:hover, .box-tile.primary-white:active {
    background: #F1F5F9;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border-radius: 18px;
    padding: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-card);
    margin-bottom: 14px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .card-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }

  .card-sub {
    font-size: 11px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  /* Lent & Owe */
  .person-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--border);
  }

  .person-row:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  .person-info {
    display: flex;
    align-items: center;
    gap: 11px;
  }

  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-transform: uppercase;
  }

  .avatar.settled {
    background: var(--surface-2);
    color: var(--text-muted);
  }

  .person-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    text-transform: capitalize;
  }

  .person-tag {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 1px;
  }

  .person-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .amount-red {
    color: var(--red);
    font-weight: 700;
    font-size: 14px;
  }

  .amount-blue {
    color: var(--blue);
    font-weight: 700;
    font-size: 14px;
  }

  .settled-pill {
    font-size: 11px;
    font-weight: 700;
    color: var(--green);
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    padding: 5px 10px;
    border-radius: 9px;
  }

  .settle-box-btn {
    border: 1px solid var(--border-strong);
    background: var(--surface-2);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    padding: 6px 11px;
    border-radius: 9px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .settle-box-btn:hover, .settle-box-btn:active {
    background: #FFFFFF;
    color: #0A0A0C;
    border-color: #FFFFFF;
  }

  /* 2-Column Bento Category Grid (matching middle screen in reference photo) */
  .cat-bento-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .cat-tile {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 15px;
    padding: 13px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 10px;
  }

  .cat-tile:hover {
    border-color: var(--border-strong);
  }

  .cat-tile.expanded {
    grid-column: 1 / -1;
    background: var(--surface-2);
    border-color: var(--border-strong);
  }

  .cat-tile-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }

  .cat-tile-title-wrap {
    display: flex;
    align-items: center;
    gap: 7px;
    min-width: 0;
  }

  .cat-icon {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--surface-3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .cat-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cat-tile-bottom {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .cat-amount {
    font-size: 17px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .cat-count {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .cat-items {
    display: none;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .cat-items.open {
    display: block;
  }

  .sub-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 11px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 11px;
    margin-bottom: 6px;
    font-size: 12px;
  }

  .sub-item:last-child {
    margin-bottom: 0;
  }

  .code-badge {
    display: inline-block;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    background: var(--surface-2);
    color: var(--text-secondary);
    padding: 2px 7px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  .edited-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    color: #0A0A0C;
    background: #E2E8F0;
    padding: 1px 6px;
    border-radius: 5px;
    margin-left: 5px;
  }

  .interactive-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    font-weight: 600;
    background: var(--surface-2);
    color: var(--text-primary);
    padding: 5px 10px;
    border-radius: 9px;
    border: 1px solid var(--border-strong);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .interactive-chip:hover, .interactive-chip:active {
    background: #FFFFFF;
    color: #0A0A0C;
  }

  .empty-state {
    text-align: center;
    padding: 18px 12px;
    color: var(--text-secondary);
  }

  .empty-state p {
    font-size: 13px;
    margin-top: 10px;
    line-height: 1.6;
    max-width: 280px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Boxy Filter Tabs & Search in Typed History */
  .filter-pills {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    background: var(--surface-2);
    padding: 4px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .filter-pill {
    padding: 7px 8px;
    border-radius: 9px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .filter-pill.active {
    background: #FFFFFF;
    color: #0A0A0C;
    font-weight: 700;
  }

  .search-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 11px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    font-family: inherit;
    font-size: 13px;
    color: var(--text-primary);
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .search-input::placeholder {
    color: var(--text-muted);
  }

  .search-input:focus {
    border-color: var(--border-strong);
    background: var(--surface-3);
  }

  .helper-subtext {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 12px 8px 4px;
    line-height: 1.5;
  }

  .log-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }

  .log-row:last-child {
    border-bottom: none;
  }

  .log-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .log-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    text-transform: capitalize;
  }

  .log-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .mini-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-secondary);
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 12px;
  }

  .mini-btn:hover {
    background: var(--surface-3);
    color: var(--text-primary);
  }

  /* Chat Tab */
  .chat-stream {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 86%;
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 13px;
    line-height: 1.5;
  }

  .msg-bot {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-bottom-left-radius: 5px;
  }

  .msg-user {
    align-self: flex-end;
    background: #FFFFFF;
    color: #0A0A0C;
    border-bottom-right-radius: 5px;
    font-weight: 600;
  }

  .saved-as-tag {
    display: inline-block;
    margin-top: 7px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 7px;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 9px;
  }

  .quick-chip {
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 9px;
    cursor: pointer;
  }

  .quick-chip:hover {
    background: #FFFFFF;
    color: #0A0A0C;
  }

  .action-pill-row {
    display: flex;

<script>
(function() {
  const STORAGE_KEY = 'contro_v11_obsidian_final';
  const now = new Date();
  const currentMonthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

  const CATEGORIES = ['Food', 'Travel', 'Books & Study', 'Shopping', 'Bills & Recharge', 'Entertainment', 'Other'];

  const CATEGORY_KEYWORDS = {
    'Food': ['tea', 'coffee', 'chai', 'lunch', 'dinner', 'breakfast', 'snack', 'snacks', 'food', 'mess', 'canteen', 'burger', 'pizza', 'biryani', 'juice', 'milk', 'maggi', 'samosa', 'fruit', 'fruits', 'water', 'meal', 'meals', 'dabeli', 'vadapav'],
    'Travel': ['auto', 'bus', 'buses', 'train', 'trains', 'cab', 'cabs', 'uber', 'ola', 'petrol', 'fuel', 'ticket', 'tickets', 'metro', 'rickshaw', 'travel', 'flight', 'rapido'],
    'Books & Study': ['book', 'books', 'pen', 'pens', 'notebook', 'notebooks', 'xerox', 'print', 'prints', 'notes', 'lab', 'apron', 'stethoscope', 'stationery', 'ipad', 'pencil', 'pencils', 'course'],
    'Shopping': ['shirt', 'shirts', 'shoes', 'shoe', 'clothes', 'bag', 'bags', 'amazon', 'flipkart', 'myntra', 'watch', 'soap', 'shampoo', 'grocery', 'groceries', 'store', 'gift', 'gifts', 'laundry'],
    'Bills & Recharge': ['recharge', 'wifi', 'bill', 'bills', 'electricity', 'rent', 'mobile', 'data', 'subscription'],
    'Entertainment': ['movie', 'movies', 'game', 'games', 'netflix', 'spotify', 'outing', 'trip', 'party', 'cinema']
  };

  const CATEGORY_ICONS = {
    'Food': '☕',
    'Travel': '🚆',
    'Books & Study': '📚',
    'Shopping': '🛍️',
    'Bills & Recharge': '⚡',
    'Entertainment': '🎬',
    'Other': '🧾'
  };

  let memoryFallback = null;
  let activeTypeFilter = 'all';
  let activeHistoryMonthKey = null;
  let limitTargetMonthKey = currentMonthKey;
  let lastSubmittedText = '';
  let lastSubmittedTime = 0;

  function cleanChatStarter() {
    return [
      {
        sender: 'bot',
        text: 'Ready to track. Try: 100-tea, 100-prem, 100-prem-tea, or +100-prem.',
        chips: ['100-tea', '100-prem', '100-prem-tea']
      }
    ];
  }

  function defaultState() {
    return {
      entries: [],
      customKeywords: {},
      defaultLimit: 5000,
      limits: { [currentMonthKey]: 5000 },
      lastBackupAt: null,
      entriesSinceBackup: 0,
      chatMessages: cleanChatStarter()
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.entries)) {
          if (!parsed.defaultLimit) parsed.defaultLimit = 5000;
          if (!parsed.customKeywords) parsed.customKeywords = {};
          if (!parsed.limits) parsed.limits = { [currentMonthKey]: parsed.defaultLimit };
          if (!Array.isArray(parsed.chatMessages)) parsed.chatMessages = cleanChatStarter();
          return parsed;
        }
      }
    } catch (e) {}
    return memoryFallback || defaultState();
  }

  let state = loadState();

  function saveState() {
    memoryFallback = state;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function getMonthLimit(ym) {
    if (state.limits && state.limits[ym] !== undefined) return state.limits[ym];
    return state.defaultLimit || 5000;
  }

  function formatINR(num) {
    const rounded = Math.round(num * 100) / 100;
    const abs = Math.abs(rounded);
    const hasDecimals = Math.abs(abs - Math.round(abs)) > 0.001;
    return '₹' + abs.toLocaleString('en-IN', hasDecimals ? { minimumFractionDigits: 0, maximumFractionDigits: 2 } : { maximumFractionDigits: 0 });
  }

  function formatMonthName(ym) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1, 1);
    return d.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  }

  function formatShortMonth(ym) {
    const [y, m] = ym.split('-').map(Number);
    const d = new Date(y, m - 1, 1);
    return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
  }

  function inferCategory(word) {
    const clean = word.toLowerCase().trim();
    if (!clean) return null;
    if (state.customKeywords && state.customKeywords[clean]) {
      return state.customKeywords[clean];
    }
    const tokens = clean.split(/[^a-z0-9]+/).filter(Boolean);
    for (const [cat, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
      if (keywords.includes(clean) || tokens.some(t => keywords.includes(t))) {
        return cat;
      }
    }
    return null;
  }

  function parseCommand(rawInput) {
    let text = rawInput.trim();
    if (!text) return null;

    let targetMonth = currentMonthKey;
    const monthPrefixMatch = text.match(/^(\d{4})-(0[1-9]|1[0-2]):\s*(.+)$/);
    if (monthPrefixMatch) {
      targetMonth = monthPrefixMatch[1] + '-' + monthPrefixMatch[2];
      text = monthPrefixMatch[3].trim();
    } else if (/^\d{4}-\d{2}:/.test(text)) {
      return null;
    }

    let isReceived = false;
    if (text.startsWith('+')) {
      isReceived = true;
      text = text.slice(1).trim();
    } else if (/^got[-\s]/i.test(text)) {
      isReceived = true;
      text = text.replace(/^got[-\s]+/i, '').trim();
    }

    if (text.startsWith('-')) return null;

    const parts = text.split('-').map(p => p.trim()).filter(Boolean);
    if (parts.length < 2) return null;

    if (!/^\d+(\.\d+)?$/.test(parts[0])) return null;
    const amount = parseFloat(parts[0]);
    if (isNaN(amount) || amount <= 0) return null;

    const id = 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    const createdAt = new Date().toISOString();

    if (parts.length >= 3) {
      const person = parts[1];
      const item = parts.slice(2).join(' ');
      const category = inferCategory(item) || 'Other';
      return {
        id,
        month: targetMonth,
        raw: rawInput.trim(),
        isTwoPart: false,
        kind: 'personal',
        amount,
        item,
        personTag: person,
        category,
        isReceived,
        edited: false,
        createdAt
      };
    }

    const second = parts[1];
    const detectedCat = inferCategory(second);

    if (detectedCat) {
      return {
        id,
        month: targetMonth,
        raw: rawInput.trim(),
        isTwoPart: true,
        rawSecond: second,
        kind: 'personal',
        amount,
        item: second,
        personTag: null,
        category: detectedCat,
        isReceived,
        edited: false,
        createdAt
      };
    } else {
      return {
        id,
        month: targetMonth,
        raw: rawInput.trim(),
        isTwoPart: true,
        rawSecond: second,
        kind: 'lent_owe',
        direction: isReceived ? 'owe' : 'lent',
        amount,
        person: second,
        isReceived,
        edited: false,
        createdAt
      };
    }
  }

  function computeMonthTotals(mEntries) {
    let personalTotal = 0;
    const perPersonNet = {};

    mEntries.forEach(e => {
      if (e.kind === 'personal') {
        personalTotal += (e.isReceived ? -e.amount : e.amount);
      } else if (e.kind === 'lent_owe') {
        const key = e.person.toLowerCase();
        if (!perPersonNet[key]) perPersonNet[key] = 0;
        perPersonNet[key] += (e.direction === 'lent' ? e.amount : -e.amount);
      }
    });

    const safePersonalTotal = Math.max(0, personalTotal);
    const positiveLentTotal = Object.values(perPersonNet)
      .filter(v => v > 0)
      .reduce((acc, v) => acc + v, 0);

    const grandTotal = safePersonalTotal + positiveLentTotal;
    return { personalTotal: safePersonalTotal, positiveLentTotal, grandTotal, perPersonNet };
  }

  let undoTimer = null;
  let pendingUndoSnapshot = null;

  function triggerToast(message, snapshotEntries) {
    pendingUndoSnapshot = snapshotEntries ? JSON.parse(JSON.stringify(snapshotEntries)) : null;
    const toast = document.getElementById('undoToast');
    const textEl = document.getElementById('undoToastText');
    const undoBtn = document.getElementById('undoActionBtn');

    textEl.textContent = message;
    undoBtn.style.display = pendingUndoSnapshot ? 'inline-block' : 'none';

    const isChat = document.getElementById('view-chat').classList.contains('active');
    toast.classList.toggle('chat-offset', isChat);
    toast.classList.add('show');

    if (undoTimer) clearTimeout(undoTimer);
    undoTimer = setTimeout(() => {
      toast.classList.remove('show');
      pendingUndoSnapshot = null;
    }, 5000);
  }

  document.getElementById('undoActionBtn').addEventListener('click', () => {
    if (pendingUndoSnapshot) {
      state.entries = pendingUndoSnapshot;
      pendingUndoSnapshot = null;
      saveState();
      renderAll();
    }
    document.getElementById('undoToast').classList.remove('show');
    if (undoTimer) clearTimeout(undoTimer);
  });

  function updateBackupReminder() {
    const dot = document.getElementById('backupDot');
    const banner = document.getElementById('reminderBanner');
    const daysSince = state.lastBackupAt
      ? (Date.now() - new Date(state.lastBackupAt).getTime()) / (1000 * 60 * 60 * 24)
      : 999;

    const needsBackup = state.entries.length > 0 && (state.entriesSinceBackup >= 15 || daysSince >= 7);
    dot.classList.toggle('show', needsBackup);
    banner.classList.toggle('show', needsBackup);
  }

  let expandedCategories = {};

  function buildDashboardHtml(targetMonth, isDrillDown) {
    const monthEntries = state.entries.filter(e => e.month === targetMonth);
    const limit = getMonthLimit(targetMonth);
    const { personalTotal, grandTotal } = computeMonthTotals(monthEntries);
    const diff = limit - grandTotal;
    const pct = limit > 0 ? Math.round((grandTotal / limit) * 100) : 0;
    const circumference = 188.5;
    const clampedPct = Math.min(100, pct);
    const dashOffset = circumference - (clampedPct / 100) * circumference;
    const ringColor = grandTotal > limit ? '#FCA5A5' : '#FFFFFF';

    const remLabel = diff < 0 ? 'Over Limit' : 'Remaining';
    const remVal = diff < 0 ? formatINR(Math.abs(diff)) : formatINR(diff);
    const remClass = diff < 0 ? 'hero-stat-val num over-limit' : 'hero-stat-val num';

    const drillHeader = isDrillDown
      ? `<div class="drilldown-bar">
           <button type="button" class="back-box-btn" id="backToHistoryListBtn">← All Months</button>
           <span class="drilldown-title">${escapeHtml(formatMonthName(targetMonth))}</span>
         </div>`
      : '';

    const heroHtml = `
      ${drillHeader}
      <div class="hero-card">
        <div class="hero-inner">
          <div class="hero-top">
            <div>
              <div class="hero-label">Total Expense</div>
              <div class="hero-amount num">${formatINR(grandTotal)}</div>
              <button type="button" class="limit-box-btn" data-open-limit-month="${escapeHtml(targetMonth)}">
                <span>Limit: ${formatINR(limit)}</span>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
                </svg>
              </button>
            </div>
            <div class="ring-wrap">
              <svg width="74" height="74" viewBox="0 0 74 74">
                <circle cx="37" cy="37" r="30" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="6"/>
                <circle cx="37" cy="37" r="30" fill="none" stroke="${ringColor}" stroke-width="6"
                  stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${dashOffset}"
                  transform="rotate(-90 37 37)"/>
              </svg>
              <div class="ring-text">
                <span class="ring-pct num">${pct}%</span>
                <span class="ring-sub">USED</span>
              </div>
            </div>
          </div>
          <div class="hero-stats">
            <div class="hero-stat">
              <div class="hero-stat-label">Personal</div>
              <div class="hero-stat-val num">${formatINR(personalTotal)}</div>
            </div>
            <div class="hero-divider"></div>
            <div class="hero-stat">
              <div class="hero-stat-label">${remLabel}</div>
              <div class="${remClass}">${remVal}</div>
            </div>
          </div>
        </div>
      </div>
    `;

    const quickBoxesHtml = !isDrillDown
      ? `<div class="box-action-row">
           <button type="button" class="box-tile" data-prefill-chat="100-tea">
             <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
             <span>Expense</span>
           </button>
           <button type="button" class="box-tile" data-prefill-chat="100-prem">
             <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="17" y1="7" x2="7" y2="17"/><polyline points="17 17 7 17 7 7"/></svg>
             <span>Lent / Owe</span>
           </button>
           <button type="button" class="box-tile primary-white" data-open-chat-tab="true">
             <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
             <span>Quick Log</span>
           </button>
         </div>`
      : '';

    const lentEntries = monthEntries.filter(e => e.kind === 'lent_owe');
    let lentCardHtml = '';
    if (lentEntries.length > 0) {
      const personMap = {};
      lentEntries.forEach(e => {
        const key = e.person.toLowerCase();
        if (!personMap[key]) personMap[key] = { name: e.person, net: 0 };
        personMap[key].net += (e.direction === 'lent' ? e.amount : -e.amount);
      });

      const rowsHtml = Object.values(personMap).map(p => {
        if (p.net === 0) {
          return `
            <div class="person-row">
              <div class="person-info">
                <div class="avatar settled">${escapeHtml(p.name.slice(0, 1))}</div>
                <div>
                  <div class="person-name">${escapeHtml(p.name)}</div>
                  <div class="person-tag">Balance cleared</div>
                </div>
              </div>
              <div class="person-right">
                <span class="settled-pill">Settled ₹0</span>
              </div>
            </div>
          `;
        }
        const isLent = p.net > 0;
        const label = isLent ? 'Owes you (Lent)' : 'You owe (Owe)';
        const amtClass = isLent ? 'amount-blue' : 'amount-red';
        const avatarStyle = isLent
          ? 'background:var(--blue-bg); color:var(--blue); border-color:var(--blue-border);'
          : 'background:var(--red-bg); color:var(--red); border-color:var(--red-border);';
        return `
          <div class="person-row">
            <div class="person-info">
              <div class="avatar" style="${avatarStyle}">${escapeHtml(p.name.slice(0, 1))}</div>
              <div>
                <div class="person-name">${escapeHtml(p.name)}</div>
                <div class="person-tag">${label}</div>
              </div>
            </div>
            <div class="person-right">
              <span class="${amtClass} num">-${formatINR(Math.abs(p.net))}</span>
              <button class="settle-box-btn" data-settle-person="${escapeHtml(p.name)}" data-settle-net="${p.net}" data-settle-month="${escapeHtml(targetMonth)}">Settle</button>
            </div>
          </div>
        `;
      }).join('');

      lentCardHtml = `
        <div class="card">
          <div class="card-header">
            <span class="card-title">Lent & Owe Balances</span>
            <span class="card-sub">Included in total</span>
          </div>
          <div>${rowsHtml}</div>
        </div>
      `;
    }

    const personalEntries = monthEntries.filter(e => e.kind === 'personal');
    let catBodyHtml = '';
    if (personalEntries.length === 0) {
      catBodyHtml = `
        <div class="empty-state">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto;">
            <path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/>
            <path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/>
            <path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>
          </svg>
          <p>No personal expenses logged yet.<br>Tap <button type="button" class="interactive-chip" data-prefill-chat="100-tea">100-tea</button> or <button type="button" class="interactive-chip" data-prefill-chat="100-prem-tea">100-prem-tea</button> to try.</p>
        </div>
      `;
    } else {
      const grouped = {};
      personalEntries.forEach(e => {
        if (!grouped[e.category]) grouped[e.category] = { total: 0, items: [] };
        grouped[e.category].total += (e.isReceived ? -e.amount : e.amount);
        grouped[e.category].items.push(e);
      });

      const tilesHtml = Object.entries(grouped)
        .sort((a, b) => b[1].total - a[1].total)
        .map(([cat, data]) => {
          const catKey = targetMonth + '::' + cat;
          const isOpen = !!expandedCategories[catKey];
          const itemsHtml = data.items.map(it => {
            const sign = it.isReceived ? '+' : '-';
            const editedBadge = it.edited ? `<span class="edited-tag">edited</span>` : '';
            return `
              <div class="sub-item">
                <div>
                  <strong style="text-transform:capitalize;">${escapeHtml(it.item)}</strong>
                  ${it.personTag ? `<span style="color:var(--text-secondary);"> · with ${escapeHtml(it.personTag)}</span>` : ''}
                  <div style="margin-top:4px;"><span class="code-badge">${escapeHtml(it.raw)}</span>${editedBadge}</div>
                </div>
                <div class="log-actions">
                  <span class="amount-red num">${sign}${formatINR(it.amount)}</span>
                  <button class="mini-btn" data-edit-id="${it.id}" title="Edit">✎</button>
                  <button class="mini-btn" data-del-id="${it.id}" title="Delete">✕</button>
                </div>
              </div>
            `;
          }).join('');

          return `
            <div class="cat-tile ${isOpen ? 'expanded' : ''}" data-toggle-cat="${escapeHtml(catKey)}">
              <div class="cat-tile-top">
                <div class="cat-tile-title-wrap">
                  <div class="cat-icon">${CATEGORY_ICONS[cat] || '🧾'}</div>
                  <span class="cat-name">${escapeHtml(cat)}</span>
                </div>
                <span class="cat-count">${data.items.length}</span>
              </div>
              <div class="cat-tile-bottom">
                <span class="cat-amount num">${formatINR(Math.max(0, data.total))}</span>
                <span style="color:var(--text-muted); font-size:11px;">${isOpen ? '▲' : '▼'}</span>
              </div>
              <div class="cat-items ${isOpen ? 'open' : ''}">${itemsHtml}</div>
            </div>
          `;
        }).join('');

      catBodyHtml = `<div class="cat-bento-grid">${tilesHtml}</div>`;
    }

    const query = (document.getElementById('historySearch') ? document.getElementById('historySearch').value : '').toLowerCase().trim();
    const filtered = monthEntries
      .slice()
      .reverse()
      .filter(e => {
        if (activeTypeFilter !== 'all' && e.kind !== activeTypeFilter) return false;
        if (!query) return true;
        return e.raw.toLowerCase().includes(query) ||
          (e.item && e.item.toLowerCase().includes(query)) ||
          (e.person && e.person.toLowerCase().includes(query)) ||
          (e.category && e.category.toLowerCase().includes(query));
      });

    let typedListHtml = '';
    if (filtered.length === 0) {
      const msg = monthEntries.length === 0
        ? 'Every command you log in Chat (like 100-tea or 100-prem) appears here for quick search and editing.'
        : 'No matching entries found for this filter or search.';
      typedListHtml = `<div class="helper-subtext">${msg}</div>`;
    } else {
      typedListHtml = filtered.map(e => {
        const title = e.kind === 'personal'
          ? `${e.item} (${e.category}${e.personTag ? ' · ' + e.personTag : ''})`
          : `${e.person} (${e.isReceived || e.direction === 'owe' ? 'Got back / Owe' : 'Lent'})`;
        const sign = e.isReceived ? '+' : '-';
        const editedBadge = e.edited ? `<span class="edited-tag">edited</span>` : '';
        const logAmtClass = (e.kind === 'lent_owe' && e.direction === 'lent') ? 'amount-blue' : 'amount-red';
        return `
          <div class="log-row">
            <div class="log-meta">
              <span class="log-title">${escapeHtml(title)}</span>
              <span><span class="code-badge">${escapeHtml(e.raw)}</span>${editedBadge}</span>
            </div>
            <div class="log-actions">
              <span class="${logAmtClass} num">${sign}${formatINR(e.amount)}</span>
              <button class="mini-btn" data-edit-id="${e.id}" title="Edit">✎</button>
              <button class="mini-btn" data-del-id="${e.id}" title="Delete">✕</button>
            </div>
          </div>
        `;
      }).join('');
    }

    const filterPillsHtml = `
      <div class="filter-pills" id="typeFilterPills">
        <button type="button" class="filter-pill ${activeTypeFilter === 'all' ? 'active' : ''}" data-filter="all">All</button>
        <button type="button" class="filter-pill ${activeTypeFilter === 'personal' ? 'active' : ''}" data-filter="personal">Personal</button>
        <button type="button" class="filter-pill ${activeTypeFilter === 'lent_owe' ? 'active' : ''}" data-filter="lent_owe">Lent & Owe</button>
      </div>
    `;

    return `
      ${heroHtml}
      ${quickBoxesHtml}
      ${lentCardHtml}
      <div class="card">
        <div class="card-header">
          <span class="card-title">Category Breakdown</span>
          <span class="card-sub">Tap tile to inspect</span>
        </div>
        <div>${catBodyHtml}</div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Recent Transactions</span>
          <span class="card-sub">${monthEntries.length} ${monthEntries.length === 1 ? 'entry' : 'entries'}</span>
        </div>
        ${filterPillsHtml}
        <input type="text" class="search-input" id="historySearch" value="${escapeHtml(query)}" placeholder="Search typed entries (e.g. tea, prem, food)...">
        <div>${typedListHtml}</div>
      </div>
    `;
  }

  function renderHome() {
    document.getElementById('headerMonthLabel').textContent = formatShortMonth(currentMonthKey);
    document.getElementById('homeDashboardSlot').innerHTML = buildDashboardHtml(currentMonthKey, false);
    updateBackupReminder();
  }

  function renderChat() {
    const stream = document.getElementById('chatStream');
    stream.innerHTML = state.chatMessages.map(m => {
      if (m.sender === 'user') {
        return `<div class="msg msg-user">${escapeHtml(m.text)}</div>`;
      }

      const chipsHtml = m.chips ? `
        <div class="chip-row">
          ${m.chips.map(c => `<button type="button" class="quick-chip" data-chip="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}
        </div>
      ` : '';

      let displayText = m.text;
      let controlsHtml = '';

      if (m.entryId) {
        const entry = state.entries.find(x => x.id === m.entryId);
        if (entry) {
          if (entry.kind === 'personal') {
            displayText = `Logged ${formatINR(entry.amount)} for ${entry.item}${entry.personTag ? ' (with ' + entry.personTag + ')' : ''}.`;
          } else {
            displayText = entry.direction === 'lent'
              ? `Logged ${entry.person} owes you ${formatINR(entry.amount)}.`
              : `Logged got back / I owe ${formatINR(entry.amount)} (${entry.person}).`;
          }

          const savedLabel = entry.kind === 'personal'
            ? `Saved as: Personal · ${entry.category}`
            : `Saved as: Lent & Owe · ${entry.direction === 'lent' ? entry.person + ' owes you' : 'Got back / I owe'}`;

          const flipDirBtn = entry.kind === 'lent_owe'
            ? `<button type="button" class="flip-btn" data-flip-id="${entry.id}">⇄ Flip Lent / Got Back</button>`
            : '';

          const reclassifyBtn = entry.isTwoPart
            ? `<button type="button" class="flip-btn" data-reclassify-id="${entry.id}">⇄ ${entry.kind === 'lent_owe' ? 'Switch to Personal Expense' : 'Switch to Lent & Owe (Person)'}</button>`
            : '';

          const catPickerHtml = (entry.kind === 'personal')
            ? `<select class="inline-cat-select" data-chat-cat-id="${entry.id}" aria-label="Change category">
                ${CATEGORIES.map(c => `<option value="${c}" ${c === entry.category ? 'selected' : ''}>${c}</option>`).join('')}
              </select>`
            : '';

          controlsHtml = `
            <div><span class="saved-as-tag">${escapeHtml(savedLabel)}</span></div>
            <div class="action-pill-row">${flipDirBtn}${reclassifyBtn}${catPickerHtml}</div>
          `;
        } else {
          displayText = m.text + ' (removed)';
        }
      }

      return `
        <div class="msg msg-bot">
          <div style="white-space:pre-line;">${escapeHtml(displayText)}</div>
          ${chipsHtml}
          ${controlsHtml}
        </div>
      `;
    }).join('');
  }

  function renderHistory() {
    const listSlot = document.getElementById('historyListSlot');
    const detailSlot = document.getElementById('historyDetailSlot');

    if (activeHistoryMonthKey) {
      listSlot.style.display = 'none';
      detailSlot.style.display = 'block';
      detailSlot.innerHTML = buildDashboardHtml(activeHistoryMonthKey, true);
      return;
    }

    listSlot.style.display = 'block';
    detailSlot.style.display = 'none';

    const monthSet = new Set([currentMonthKey, ...state.entries.map(e => e.month)]);
    const months = Array.from(monthSet).sort().reverse();

    listSlot.innerHTML = months.map(ym => {
      const mEntries = state.entries.filter(e => e.month === ym);
      const limit = getMonthLimit(ym);
      const { grandTotal, perPersonNet } = computeMonthTotals(mEntries);

      const outgoing = mEntries.filter(e => !(e.isReceived || (e.kind === 'lent_owe' && e.direction === 'owe')));
      let largest = null;
      outgoing.forEach(e => {
        if (!largest || e.amount > largest.amount) largest = e;
      });

      let circleClass = 'circle-grey';
      let statusWord = 'On Limit';
      if (grandTotal > limit) {
        circleClass = 'circle-red';
        statusWord = 'Over Limit';
      } else if (grandTotal < limit) {
        circleClass = 'circle-green';
        statusWord = 'Under Limit';
      }

      const largestText = largest
        ? `${formatINR(largest.amount)} (${largest.kind === 'personal' ? largest.item : largest.person})`
        : 'None yet';

      const diff = limit - grandTotal;
      const budgetDiffLabel = diff >= 0 ? 'Money Saved' : 'Spent More Than Limit';
      const budgetDiffVal = diff >= 0 ? formatINR(diff) : formatINR(Math.abs(diff));

      const owesMe = Object.values(perPersonNet).filter(v => v > 0).reduce((a, b) => a + b, 0);
      const iOwe = Math.abs(Object.values(perPersonNet).filter(v => v < 0).reduce((a, b) => a + b, 0));

      let splitStatusHtml = 'All settled (₹0)';
      if (owesMe > 0 && iOwe > 0) {
        splitStatusHtml = `<span style="color:var(--blue);">Lent: ${formatINR(owesMe)}</span> · <span style="color:var(--red);">Owe: ${formatINR(iOwe)}</span>`;
      } else if (owesMe > 0) {
        splitStatusHtml = `<span style="color:var(--blue);">Someone owes me ${formatINR(owesMe)}</span>`;
      } else if (iOwe > 0) {
        splitStatusHtml = `<span style="color:var(--red);">I owe ${formatINR(iOwe)}</span>`;
      }

      return `
        <div class="history-card" data-open-history-month="${escapeHtml(ym)}">
          <div class="history-left">
            <div class="history-month">
              <span>${formatMonthName(ym)}</span>
              <span class="open-hint">Open</span>
            </div>
            <div class="history-metric">
              <span class="history-metric-label">Largest Expense</span>
              <span class="history-metric-val num">${escapeHtml(largestText)}</span>
            </div>
            <div class="history-metric">
              <span class="history-metric-label">${budgetDiffLabel}</span>
              <span class="history-metric-val num">${budgetDiffVal}</span>
            </div>
            <div class="history-metric">
              <span class="history-metric-label">Lent & Owe Status</span>
              <span class="history-metric-val num">${splitStatusHtml}</span>
            </div>
          </div>
          <div class="status-circle ${circleClass}">
            <span class="circle-amt num">${formatINR(grandTotal)}</span>
            <span class="circle-sub">${statusWord}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  function renderAll() {
    renderHome();
    renderChat();
    renderHistory();
  }

  function switchTab(tab) {
    if (tab !== 'history') {
      activeHistoryMonthKey = null;
    }
    document.querySelectorAll('.tab-view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + tab).classList.add('active');

    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    const dock = document.getElementById('chatDock');
    const viewContainer = document.getElementById('viewContainer');
    dock.classList.toggle('show', tab === 'chat');
    viewContainer.classList.toggle('chat-active', tab === 'chat');

    const toast = document.getElementById('undoToast');
    toast.classList.toggle('chat-offset', tab === 'chat');

    if (tab === 'chat') {
      setTimeout(() => {
        viewContainer.scrollTop = viewContainer.scrollHeight;
        document.getElementById('chatInput').focus();
      }, 30);
    }
  }

  function handleChatSubmit(raw) {
    const trimmed = raw.trim();
    if (!trimmed) return;

    const nowMs = Date.now();
    if (trimmed.toLowerCase() === lastSubmittedText.toLowerCase() && (nowMs - lastSubmittedTime) < 1200) {
      return;
    }
    lastSubmittedText = trimmed;
    lastSubmittedTime = nowMs;

    state.chatMessages.push({ sender: 'user', text: trimmed });
    const parsed = parseCommand(trimmed);

    if (!parsed) {
      state.chatMessages.push({
        sender: 'bot',
        text: 'Use format Amount-Item (100-tea), Amount-Person (100-prem), or Amount-Person-Item (100-prem-tea).'
      });
    } else {
      state.entries.push(parsed);
      state.entriesSinceBackup = (state.entriesSinceBackup || 0) + 1;

      if (parsed.kind === 'personal') {
        state.chatMessages.push({
          sender: 'bot',
          text: `Logged ${formatINR(parsed.amount)} for ${parsed.item}${parsed.personTag ? ' (with ' + parsed.personTag + ')' : ''}.`,
          entryId: parsed.id
        });
      } else {
        const dirText = parsed.direction === 'lent'
          ? `${parsed.person} owes you ${formatINR(parsed.amount)}`
          : `Got back / I owe ${formatINR(parsed.amount)} (${parsed.person})`;
        state.chatMessages.push({
          sender: 'bot',
          text: `Logged ${dirText}.`,
          entryId: parsed.id
        });
      }
    }

    saveState();
    renderAll();
    const vc = document.getElementById('viewContainer');
    vc.scrollTop = vc.scrollHeight;
  }

  function downloadBlob(filename, content, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportJsonBackup() {
    state.lastBackupAt = new Date().toISOString();
    state.entriesSinceBackup = 0;
    saveState();
    updateBackupReminder();
    const dateStamp = new Date().toISOString().slice(0, 10);
    downloadBlob(`Contro_Backup_${dateStamp}.json`, JSON.stringify(state, null, 2), 'application/json');
  }

  function exportCsvBackup() {
    const rows = [['Date', 'Month', 'Typed Command', 'Type', 'Category / Direction', 'Item / Person', 'Amount (INR)']];
    state.entries.forEach(e => {
      rows.push([
        e.createdAt.slice(0, 10),
        e.month,
        `"${e.raw.replace(/"/g, '""')}"`,
        e.kind === 'personal' ? 'Personal Expense' : 'Lent & Owe',
        e.kind === 'personal' ? e.category : (e.direction === 'lent' ? 'Lent' : 'Got Back / Owe'),
        `"${(e.kind === 'personal' ? e.item : e.person).replace(/"/g, '""')}"`,
        e.amount
      ]);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    downloadBlob(`Contro_Expenses_${new Date().toISOString().slice(0, 10)}.csv`, csv, 'text/csv');
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  document.getElementById('chatDock').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('chatInput');
    handleChatSubmit(input.value);
    input.value = '';
  });

  document.addEventListener('input', e => {
    if (e.target && e.target.id === 'historySearch') {
      const selStart = e.target.selectionStart;
      const selEnd = e.target.selectionEnd;
      renderAll();
      const updatedSearch = document.getElementById('historySearch');
      if (updatedSearch) {
        updatedSearch.focus();
        try { updatedSearch.setSelectionRange(selStart, selEnd); } catch (err) {}
      }
    }
  });

  document.querySelectorAll('[data-limit-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('limitInput').value = btn.dataset.limitPreset;
    });
  });

  document.getElementById('applyMonthLimitBtn').addEventListener('click', () => {
    const val = parseFloat(document.getElementById('limitInput').value);
    if (!isNaN(val) && val > 0) {
      state.limits[limitTargetMonthKey] = Math.round(val);
      saveState();
      renderAll();
    }
    document.getElementById('limitModal').classList.remove('open');
  });

  document.getElementById('applyAllLimitBtn').addEventListener('click', () => {
    const val = parseFloat(document.getElementById('limitInput').value);
    if (!isNaN(val) && val > 0) {
      const rounded = Math.round(val);
      state.defaultLimit = rounded;
      Object.keys(state.limits).forEach(k => { state.limits[k] = rounded; });
      state.limits[limitTargetMonthKey] = rounded;
      saveState();
      renderAll();
    }
    document.getElementById('limitModal').classList.remove('open');
  });

  document.getElementById('closeLimitModal').addEventListener('click', () => {
    document.getElementById('limitModal').classList.remove('open');
  });

  document.addEventListener('change', e => {
    const catSelect = e.target.closest('[data-chat-cat-id]');
    if (catSelect) {
      const entry = state.entries.find(x => x.id === catSelect.dataset.chatCatId);
      if (entry && entry.kind === 'personal') {
        entry.category = catSelect.value;
        if (entry.item) {
          state.customKeywords[entry.item.toLowerCase().trim()] = catSelect.value;
        }
        saveState();
        renderAll();
      }
    }
  });

  document.addEventListener('click', e => {
    if (e.target.closest('[data-open-chat-tab]')) {
      switchTab('chat');
      return;
    }

    const openLimitBtn = e.target.closest('[data-open-limit-month]');
    if (openLimitBtn) {
      limitTargetMonthKey = openLimitBtn.dataset.openLimitMonth;
      document.getElementById('limitModalTitle').textContent = 'Limit for ' + formatShortMonth(limitTargetMonthKey);
      document.getElementById('limitInput').value = getMonthLimit(limitTargetMonthKey);
      document.getElementById('limitModal').classList.add('open');
      return;
    }

    const historyCard = e.target.closest('[data-open-history-month]');
    if (historyCard) {
      activeHistoryMonthKey = historyCard.dataset.openHistoryMonth;
      renderHistory();
      document.getElementById('viewContainer').scrollTop = 0;
      return;
    }

    if (e.target.closest('#backToHistoryListBtn')) {
      activeHistoryMonthKey = null;
      renderHistory();
      document.getElementById('viewContainer').scrollTop = 0;
      return;
    }

    const filterPill = e.target.closest('#typeFilterPills .filter-pill');
    if (filterPill) {
      activeTypeFilter = filterPill.dataset.filter;
      renderAll();
      return;
    }

    const prefillBtn = e.target.closest('[data-prefill-chat]');
    if (prefillBtn) {
      switchTab('chat');
      const input = document.getElementById('chatInput');
      input.value = prefillBtn.dataset.prefillChat;
      input.focus();
      return;
    }

    const editBtn = e.target.closest('[data-edit-id]');
    if (editBtn) {
      e.stopPropagation();
      const entry = state.entries.find(x => x.id === editBtn.dataset.editId);
      if (entry) {
        document.getElementById('editEntryId').value = entry.id;
        document.getElementById('editAmount').value = entry.amount;
        document.getElementById('editLabel').value = entry.kind === 'personal' ? entry.item : entry.person;
        document.getElementById('editCategory').value = entry.category || 'Other';
        document.getElementById('editCategory').disabled = entry.kind !== 'personal';
        document.getElementById('editModal').classList.add('open');
      }
      return;
    }

    const delBtn = e.target.closest('[data-del-id]');
    if (delBtn) {
      e.stopPropagation();
      const snapshot = state.entries;
      const target = state.entries.find(x => x.id === delBtn.dataset.delId);
      state.entries = state.entries.filter(x => x.id !== delBtn.dataset.delId);
      saveState();
      renderAll();
      triggerToast(`Deleted ${target ? target.raw : 'entry'}`, snapshot);
      return;
    }

    const toggleCat = e.target.closest('[data-toggle-cat]');
    if (toggleCat) {
      const catKey = toggleCat.dataset.toggleCat;
      expandedCategories[catKey] = !expandedCategories[catKey];
      renderAll();
      return;
    }

    const chip = e.target.closest('[data-chip]');
    if (chip) {
      handleChatSubmit(chip.dataset.chip);
      return;
    }

    const flipBtn = e.target.closest('[data-flip-id]');
    if (flipBtn) {
      const entry = state.entries.find(x => x.id === flipBtn.dataset.flipId);
      if (entry && entry.kind === 'lent_owe') {
        entry.direction = entry.direction === 'lent' ? 'owe' : 'lent';
        entry.isReceived = entry.direction === 'owe';
        saveState();
        renderAll();
      }
      return;
    }

    const reclassifyBtn = e.target.closest('[data-reclassify-id]');
    if (reclassifyBtn) {
      const entry = state.entries.find(x => x.id === reclassifyBtn.dataset.reclassifyId);
      if (entry && entry.isTwoPart) {
        const label = entry.rawSecond || entry.item || entry.person;
        if (entry.kind === 'lent_owe') {
          entry.kind = 'personal';
          entry.item = label;
          entry.category = inferCategory(label) || 'Other';
          entry.personTag = null;
          entry.isReceived = false;
        } else {
          entry.kind = 'lent_owe';
          entry.person = label;
          entry.direction = 'lent';
          entry.isReceived = false;
        }
        saveState();
        renderAll();
      }
      return;
    }

    const settleBtn = e.target.closest('[data-settle-person]');
    if (settleBtn) {
      const snapshot = state.entries;
      const person = settleBtn.dataset.settlePerson;
      const net = parseFloat(settleBtn.dataset.settleNet);
      const settleMonth = settleBtn.dataset.settleMonth || currentMonthKey;
      const absAmt = Math.abs(net);
      state.entries = [
        ...state.entries,
        {
          id: 'tx_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
          month: settleMonth,
          raw: `settle-${absAmt}-${person}`,
          isTwoPart: false,
          kind: 'lent_owe',
          direction: net > 0 ? 'owe' : 'lent',
          amount: absAmt,
          person,
          isReceived: net > 0,
          edited: false,
          createdAt: new Date().toISOString()
        }
      ];
      saveState();
      renderAll();
      triggerToast(`Settled ${formatINR(absAmt)} with ${person}`, snapshot);
      return;
    }
  });

  document.getElementById('cancelEditBtn').addEventListener('click', () => {
    document.getElementById('editModal').classList.remove('open');
  });

  document.getElementById('saveEditBtn').addEventListener('click', () => {
    const id = document.getElementById('editEntryId').value;
    const entry = state.entries.find(x => x.id === id);
    if (entry) {
      const amt = parseFloat(document.getElementById('editAmount').value);
      const lbl = document.getElementById('editLabel').value.trim();
      let changed = false;
      if (!isNaN(amt) && amt > 0 && amt !== entry.amount) {
        entry.amount = amt;
        changed = true;
      }
      if (lbl) {
        if (entry.kind === 'personal' && lbl !== entry.item) {
          entry.item = lbl;
          changed = true;
        } else if (entry.kind !== 'personal' && lbl !== entry.person) {
          entry.person = lbl;
          changed = true;
        }
      }
      if (entry.kind === 'personal' && entry.category !== document.getElementById('editCategory').value) {
        entry.category = document.getElementById('editCategory').value;
        changed = true;
      }
      if (changed) entry.edited = true;
      saveState();
      renderAll();
    }
    document.getElementById('editModal').classList.remove('open');
  });

  document.getElementById('backupOpenBtn').addEventListener('click', () => {
    const originText = (window.location && window.location.origin && window.location.origin !== 'null')
      ? `Saved in local storage (${window.location.origin}). Export JSON to back up or transfer.`
      : 'Saved in local storage for this file/browser. Export JSON to back up or transfer.';
    document.getElementById('storageOriginNote').textContent = originText;
    document.getElementById('backupModal').classList.add('open');
  });

  document.getElementById('closeBackupModal').addEventListener('click', () => {
    document.getElementById('backupModal').classList.remove('open');
  });

  document.getElementById('exportJsonBtn').addEventListener('click', exportJsonBackup);
  document.getElementById('quickBackupBtn').addEventListener('click', exportJsonBackup);
  document.getElementById('exportCsvBtn').addEventListener('click', exportCsvBackup);

  document.getElementById('restoreJsonBtn').addEventListener('click', () => {
    document.getElementById('restoreFileInput').click();
  });

  document.getElementById('restoreFileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (imported && Array.isArray(imported.entries)) {
          state = imported;
          if (!state.customKeywords) state.customKeywords = {};
          if (!state.limits) state.limits = { [currentMonthKey]: state.defaultLimit || 5000 };
          if (!Array.isArray(state.chatMessages)) state.chatMessages = cleanChatStarter();
          saveState();
          renderAll();
          document.getElementById('backupModal').classList.remove('open');
          triggerToast(`Restored ${state.entries.length} entries from backup`, null);
        }
      } catch (err) {
        triggerToast('Invalid JSON backup file', null);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  document.getElementById('clearChatBtn').addEventListener('click', () => {
    state.chatMessages = cleanChatStarter();
    saveState();
    renderChat();
    document.getElementById('backupModal').classList.remove('open');
    triggerToast('Chat log cleared', null);
  });

  document.getElementById('resetZeroBtn').addEventListener('click', () => {
    const snapshot = state.entries;
    activeHistoryMonthKey = null;
    state = defaultState();
    saveState();
    renderAll();
    document.getElementById('backupModal').classList.remove('open');
    triggerToast('All history cleared and reset to ₹0', snapshot);
  });

  renderAll();
})();
</script>
</body>
</html>
